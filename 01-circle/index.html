<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>01 – Circle</title>
  <style>
    body {
      margin: 0;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="400" height="400"></canvas>

  <script>
    // Get the canvas element and its 2D drawing context
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Find the centre of the canvas
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const baseRadius = 100;

    function draw(time) {
      // Fill the whole canvas with white (this also erases the previous frame)
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Let the radius grow and shrink over time
      const radius = baseRadius + Math.sin(time / 500) * 10;

      // Draw the circle in the centre
      ctx.fillStyle = "black";
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fill();

      // Ask the browser to call draw again for the next frame
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
