<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>01 – Pulsating Circle</title>
  <style>
    body {
      margin: 0;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    // Get the canvas element and its 2D drawing context
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // Make the canvas as big as the browser window
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    // Set the canvas size once when the page loads
    resizeCanvas();
    
    // Resize the canvas again whenever the window changes size
    window.addEventListener("resize", resizeCanvas);

    // Base radius of the circle
    const baseRadius = 200;

    function draw(time) {
      // Fill the whole canvas with white (this also erases the previous frame)
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Let the radius grow and shrink over time
      const radius = baseRadius + Math.sin(time / 500) * 10;

      // Draw the circle in the centre
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const size = radius * 2;
      
      // Let the corners change between sharp (square) and round (circle)
      const roundness = (Math.sin(time / 500) + 1) / 2;
      const cornerRadius = radius * roundness;

      ctx.fillStyle = "black";
      ctx.beginPath();
      ctx.roundRect(centerX - radius, centerY - radius, size, size, cornerRadius);
      ctx.fill();

      // Ask the browser to call draw again for the next frame
      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
